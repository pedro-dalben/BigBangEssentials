id: pokemarket_claims
schema-version: 2
size: 54
title: "&8&lPokéMarket &7• &dRetiradas"
flags:
  cache-rendered-items: false
  close-on-world-change: true
  prevent-item-take: true
pagination:
  enabled: true
  source: "pokemarket.claims"
  content-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
dynamic-item-template:
  item:
    material-id: "minecraft:hopper"
    display-name: "&d{claim_label}"
    lore: ["&7Valor/conteúdo: &f{amount}", "", "&eClique para retirar"]
  actions:
    - type: "pokemarket_claim"
      params: { claim_id: "{claim_id}" }
pages:
  main:
    default-page: true
    items:
      frame:
        slots: [0,1,2,3,5,6,7,8,9,17,18,26,27,35,36,44,46,48,50,51,52]
        item: { material-id: "minecraft:black_stained_glass_pane", display-name: " " }
      claim_all:
        slot: 4
        item: { material-id: "minecraft:chest", display-name: "&aRetirar tudo", lore: ["&7Processa todos os claims disponíveis."] }
        actions: [{ type: "pokemarket_claim_all" }]
      previous:
        slot: 45
        item: { material-id: "minecraft:arrow", display-name: "&ePágina anterior" }
        actions: [{ type: "previous_page" }]
      back:
        slot: 49
        item: { material-id: "minecraft:oak_door", display-name: "&cVoltar" }
        actions: [{ type: "back_menu" }]
      next:
        slot: 53
        item: { material-id: "minecraft:arrow", display-name: "&ePróxima página" }
        actions: [{ type: "next_page" }]
