id: pokemarket_main
schema-version: 2
size: 27
title: "&8&lPokéMarket &7• &bCentral"
flags:
  cache-rendered-items: false
  close-on-world-change: true
  prevent-item-take: true
pages:
  main:
    default-page: true
    items:
      frame:
        slots: [0,1,2,3,4,5,6,7,8,24,26]
        item: { material-id: "minecraft:black_stained_glass_pane", display-name: " " }
      browse:
        slot: 10
        item:
          material-id: "minecraft:compass"
          display-name: "&bExplorar anúncios"
          lore: ["&7Veja Pokémon disponíveis", "&7e abra os detalhes antes de comprar.", "", "&eClique para abrir"]
        actions:
          - type: "open_menu"
            params: { menu-id: "pokemarket_browse" }
      party:
        slot: 12
        item:
          material-id: "minecraft:player_head"
          display-name: "&aAnunciar venda"
          lore: ["&7Venda um Pokémon da sua party", "&7por dinheiro e confirme o preço"]
        actions:
          - type: "pokemarket_source_open"
            params: { mode: "money", source: "party" }
      pc:
        slot: 14
        item:
          material-id: "minecraft:chest"
          display-name: "&bAnunciar venda do PC"
          lore: ["&7Venda um Pokémon do PC", "&7e confirme o preço"]
        actions:
          - type: "pokemarket_source_open"
            params: { mode: "money", source: "pc" }
      trade_party:
        slot: 13
        item: { material-id: "minecraft:emerald", display-name: "&dAnunciar troca", lore: ["&7Escolha seu Pokémon e defina", "&7os requisitos em etapas."] }
        actions:
          - type: "pokemarket_source_open"
            params: { mode: "trade", source: "party" }
      browse_history:
        slot: 15
        item: { material-id: "minecraft:book", display-name: "&fHistórico" }
        actions:
          - type: "send_message"
            params: { message: "&7O histórico visual será aberto nesta mesma central." }
      my_listings:
        slot: 17
        item: { material-id: "minecraft:map", display-name: "&bMeus anúncios" }
        actions: [{ type: "pokemarket_records_open", params: { record_type: "listings" } }]
      purchases:
        slot: 18
        item: { material-id: "minecraft:emerald", display-name: "&aMinhas compras" }
        actions: [{ type: "pokemarket_records_open", params: { record_type: "purchases" } }]
      sales:
        slot: 19
        item: { material-id: "minecraft:gold_ingot", display-name: "&6Minhas vendas" }
        actions: [{ type: "pokemarket_records_open", params: { record_type: "sales" } }]
      notifications:
        slot: 20
        item: { material-id: "minecraft:bell", display-name: "&6Notificações" }
        actions:
          - type: "open_menu"
            params: { menu-id: "pokemarket_notifications" }
      help:
        slot: 21
        item: { material-id: "minecraft:paper", display-name: "&eAjuda" }
        actions:
          - type: "send_message"
            params: { message: "&bPokéMarket &7— escolha uma ação. Compras e anúncios sempre pedem confirmação." }
      claims:
        slot: 16
        item:
          material-id: "minecraft:hopper"
          display-name: "&dMinhas retiradas"
          lore: ["&7Retire Pokémon e dinheiro", "&7com segurança."]
        actions:
          - type: "open_menu"
            params: { menu-id: "pokemarket_claims" }
      trades:
        slot: 23
        item: { material-id: "minecraft:amethyst_shard", display-name: "&dMinhas trocas" }
        actions: [{ type: "pokemarket_records_open", params: { record_type: "trades" } }]
      admin:
        slot: 25
        item: { material-id: "minecraft:command_block", display-name: "&cPainel Staff", lore: ["&7Health, estatísticas, listagens", "&7e operações administrativas."] }
        view-permission: "bigbangessentials.pokemarket.admin"
        actions: [{ type: "open_menu", params: { menu-id: "pokemarket_admin" } }]
      close:
        slot: 22
        item:
          material-id: "minecraft:barrier"
          display-name: "&cFechar"
        actions:
          - type: "close_menu"
