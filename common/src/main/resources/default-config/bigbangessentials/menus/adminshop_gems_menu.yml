id: "adminshop_gems_menu"
size: 54
title: "<light_purple>Cash Shop"
pagination:
  enabled: true
  source: "adminshop.gems"
  content-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34,37,38,39,40,41,42,43]
dynamic-item-template:
  item:
    material-id: "{display_item}"
    display-name: "<light_purple>{product_name}"
    lore: ["<yellow>Comprar: <white>{buy_price} gems", "", "<green>Clique esquerdo: comprar"]
  actions:
    - type: "adminshop_buy"
      params: { product-id: "{product_id}" }
      clicks: ["LEFT"]
pages:
  main:
    default-page: true
    items:
      prev: { slot: 48, item: { material-id: "minecraft:paper", display-name: "<yellow>Anterior" }, actions: [{ type: "previous_page" }] }
      next: { slot: 50, item: { material-id: "minecraft:paper", display-name: "<yellow>Próxima" }, actions: [{ type: "next_page" }] }
      close: { slot: 49, item: { material-id: "minecraft:barrier", display-name: "<red>Fechar" }, actions: [{ type: "close_menu" }] }
