id: pokemarket_notifications
schema-version: 2
size: 54
title: "&8&lPokéMarket &7• &6Notificações"
flags:
  cache-rendered-items: false
  close-on-world-change: true
  prevent-item-take: true
pagination:
  enabled: true
  source: "pokemarket.notifications"
  content-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
dynamic-item-template:
  item:
    material-id: "minecraft:bell"
    display-name: "&6{type}"
    lore: ["&7Status: &f{status}", "&7Referência: &f{reference}", "", "&eClique para marcar como lida"]
  actions:
    - type: "pokemarket_notification_read"
      params: { notification_id: "{notification_id}" }
pages:
  main:
    default-page: true
    items:
      frame:
        slots: [0,1,2,3,5,6,7,8,9,17,18,26,27,35,36,44,46,48,50,51,52]
        item: { material-id: "minecraft:black_stained_glass_pane", display-name: " " }
      read_all:
        slot: 4
        item: { material-id: "minecraft:book", display-name: "&aMarcar tudo como lido" }
        actions:
          - type: "send_message"
            params: { message: "&7Use a aba de notificações para revisar cada evento do mercado." }
      previous:
        slot: 45
        item: { material-id: "minecraft:arrow", display-name: "&ePágina anterior" }
        actions: [{ type: "previous_page" }]
      back:
        slot: 49
        item: { material-id: "minecraft:oak_door", display-name: "&cVoltar" }
        actions: [{ type: "back_menu" }]
      next:
        slot: 53
        item: { material-id: "minecraft:arrow", display-name: "&ePróxima página" }
        actions: [{ type: "next_page" }]
