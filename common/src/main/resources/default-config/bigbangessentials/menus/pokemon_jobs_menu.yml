id: "pokemon_jobs_menu"
size: 54
title: "<aqua>Profissões Pokémon"

pagination:
  enabled: true
  source: "jobs.pokemon"
  content-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]

dynamic-item-template:
  item:
    material-id: "{job_icon}"
    display-name: "{job_status_color}{job_display_name}"
    lore:
      - "<gray>{job_description}"
      - ""
      - "<gray>Nível: <white>{job_level}"
      - "<gray>XP: <white>{job_xp} / {job_xp_required}"
      - "{job_xp_progress_bar}"
      - "<gray>Categoria: <white>{job_category_label}"
      - "<gray>Rank: <white>{job_required_rank_label}"
      - "<gray>Licença: {job_license_required_label}"
      - "<gray>Status da licença: {job_license_status}"
      - "{job_license_objectives}"
      - "{job_license_progress}"
      - "<gray>Status: {job_status_color}{job_status}"
      - ""
      - "<green>Clique Esquerdo: Ver detalhes / marcos"
      - "<yellow>Clique Direito: Entrar na Especialização"
  actions:
    - type: "open_job_details"
      params:
        job-id: "{job_id}"
        menu-id: "pokemon_job_details_menu"
      clicks: ["LEFT"]
    - type: "toggle_job"
      params:
        job-id: "{job_id}"
      clicks: ["RIGHT"]

pages:
  main:
    default-page: true
    items:
      summary:
        slot: 4
        item:
          material-id: "minecraft:beacon"
          display-name: "<aqua>Resumo de Especializações Pokémon"
          lore:
            - "<gray>As profissões Pokémon são integradas ao Cobbleverse!"
            - "<gray>Requerem RankUp e missões de licença."
      close_btn:
        slot: 49
        item:
          material-id: "minecraft:barrier"
          display-name: "<red>Fechar"
        actions:
          - type: "close_menu"
      back_btn:
        slot: 48
        item:
          material-id: "minecraft:arrow"
          display-name: "<yellow>Voltar a Trabalhos"
        actions:
          - type: "open_menu"
            params:
              menu-id: "jobs_menu"
