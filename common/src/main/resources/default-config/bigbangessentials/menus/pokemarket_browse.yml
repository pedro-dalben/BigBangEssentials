id: pokemarket_browse
schema-version: 2
size: 54
title: "&8&lPokéMarket &7• &bExplorar"
flags:
  cache-rendered-items: false
  close-on-world-change: true
  prevent-item-take: true
pagination:
  enabled: true
  source: "pokemarket.listings"
  content-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
dynamic-item-template:
  item:
    material-id: "minecraft:player_head"
    display-name: "&b{species} &7Lv.{level}"
    lore:
      - "&7Vendedor: &f{seller}"
      - "&7Shiny: &f{shiny} &8• &7IVs perfeitos: &f{perfect_ivs}"
      - "&7Tipo: &f{listing_kind}"
      - "&7Valor: &6{price}"
      - ""
      - "&eClique para ver detalhes"
  actions:
    - type: "pokemarket_listing_detail"
      params: { listing_id: "{listing_id}" }
      clicks: ["LEFT"]
pages:
  main:
    default-page: true
    items:
      frame:
        slots: [9,17,18,26,27,35,36,44,46,48,50,51,52]
        item: { material-id: "minecraft:black_stained_glass_pane", display-name: " " }
      header:
        slot: 0
        item: { material-id: "minecraft:black_stained_glass_pane", display-name: " " }
      filters:
        slot: 4
        item:
          material-id: "minecraft:hopper"
          display-name: "&bEspécie"
          lore: ["&7Escolha pela lista A–Z."]
        actions:
          - type: "open_menu"
            params: { menu-id: "pokemarket_species" }
      type:
        slot: 1
        item: { material-id: "minecraft:emerald", display-name: "&aTipo", lore: ["&7Alterna: todos, venda e troca."] }
        actions: [{ type: "pokemarket_filter_type" }]
      shiny:
        slot: 2
        item: { material-id: "minecraft:glowstone", display-name: "&eShiny", lore: ["&7Alterna: todos, sim e não."] }
        actions: [{ type: "pokemarket_filter_shiny" }]
      levels:
        slot: 3
        item: { material-id: "minecraft:experience_bottle", display-name: "&bNível 1–25", lore: ["&7Clique para aplicar esta faixa."] }
        actions:
          - type: "pokemarket_filter_level"
            params: { range: "1-25" }
      ivs:
        slot: 5
        item: { material-id: "minecraft:diamond", display-name: "&bIVs mínimos", lore: ["&7Alterna 0, 3 e 6 IVs perfeitos."] }
        actions: [{ type: "pokemarket_filter_ivs" }]
      price_min:
        slot: 6
        item: { material-id: "minecraft:gold_nugget", display-name: "&6Preço mínimo", lore: ["&7Digite um valor temporário no chat."] }
        actions:
          - type: "pokemarket_filter_price"
            params: { bound: "min" }
      price_max:
        slot: 7
        item: { material-id: "minecraft:gold_ingot", display-name: "&6Preço máximo", lore: ["&7Digite um valor temporário no chat."] }
        actions:
          - type: "pokemarket_filter_price"
            params: { bound: "max" }
      sort:
        slot: 8
        item: { material-id: "minecraft:paper", display-name: "&fOrdenação", lore: ["&7Alterna recentes, preço e nível."] }
        actions: [{ type: "pokemarket_filter_sort" }]
      clear_filters:
        slot: 47
        item: { material-id: "minecraft:barrier", display-name: "&cLimpar filtros" }
        actions: [{ type: "pokemarket_filter_clear" }]
      previous:
        slot: 45
        item: { material-id: "minecraft:arrow", display-name: "&ePágina anterior" }
        actions: [{ type: "previous_page" }]
      back:
        slot: 49
        item: { material-id: "minecraft:oak_door", display-name: "&cVoltar" }
        actions: [{ type: "back_menu" }]
      next:
        slot: 53
        item: { material-id: "minecraft:arrow", display-name: "&ePróxima página" }
        actions: [{ type: "next_page" }]
