id: pokemarket_records
schema-version: 2
size: 54
title: "&8&lPokéMarket &7• &fMeus registros"
flags:
  cache-rendered-items: false
  close-on-world-change: true
  prevent-item-take: true
pagination:
  enabled: true
  source: "pokemarket.records"
  content-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
dynamic-item-template:
  item:
    material-id: "minecraft:paper"
    display-name: "&f{subject}"
    lore: ["&7Status: &f{status}", "&7Valor: &6{price}", "", "&e{action_hint}"]
  actions:
    - type: "pokemarket_record_action"
      params: { record_type: "{record_type}", record_id: "{record_id}", subject: "{subject}" }
pages:
  main:
    default-page: true
    items:
      frame:
        slots: [0,4,7,8,9,17,18,26,27,35,36,44,46,48,50,51,52]
        item: { material-id: "minecraft:black_stained_glass_pane", display-name: " " }
      listings:
        slot: 1
        item: { material-id: "minecraft:map", display-name: "&bAnúncios" }
        actions: [{ type: "pokemarket_records_open", params: { record_type: "listings" } }]
      purchases:
        slot: 2
        item: { material-id: "minecraft:emerald", display-name: "&aCompras" }
        actions: [{ type: "pokemarket_records_open", params: { record_type: "purchases" } }]
      sales:
        slot: 3
        item: { material-id: "minecraft:gold_ingot", display-name: "&6Vendas" }
        actions: [{ type: "pokemarket_records_open", params: { record_type: "sales" } }]
      trades:
        slot: 5
        item: { material-id: "minecraft:amethyst_shard", display-name: "&dTrocas" }
        actions: [{ type: "pokemarket_records_open", params: { record_type: "trades" } }]
      history:
        slot: 6
        item: { material-id: "minecraft:book", display-name: "&fHistórico" }
        actions: [{ type: "pokemarket_records_open", params: { record_type: "history" } }]
      previous:
        slot: 45
        item: { material-id: "minecraft:arrow", display-name: "&ePágina anterior" }
        actions: [{ type: "previous_page" }]
      back:
        slot: 49
        item: { material-id: "minecraft:oak_door", display-name: "&cVoltar" }
        actions: [{ type: "back_menu" }]
      next:
        slot: 53
        item: { material-id: "minecraft:arrow", display-name: "&ePróxima página" }
        actions: [{ type: "next_page" }]
