id: "homes_menu"
size: 54
title: "<gold>Minhas Homes"

pagination:
  enabled: true
  source: "homes.player"
  content-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]

dynamic-item-template:
  item:
    material-id: "{home_icon}"
    display-name: "<yellow>{home_name}"
    lore:
      - "<gray>Mundo: <white>{home_world}"
      - "<gray>Coordenadas: <white>{home_x}, {home_y}, {home_z}"
      - ""
      - "<green>Clique Esquerdo para teleportar."
      - "<red>Clique Direito para deletar."
  actions:
    - type: "teleport_home"
      params:
        home-name: "{home_name}"

pages:
  main:
    default-page: true
    items:
      back_btn:
        slot: 45
        item:
          material-id: "minecraft:arrow"
          display-name: "<red>Voltar"
        actions:
          - type: "open_menu"
            params:
              menu-id: "teleports_main_menu"
      prev_btn:
        slot: 48
        item:
          material-id: "minecraft:paper"
          display-name: "<yellow>Página Anterior"
        actions:
          - type: "previous_page"
      next_btn:
        slot: 50
        item:
          material-id: "minecraft:paper"
          display-name: "<yellow>Próxima Página"
        actions:
          - type: "next_page"
