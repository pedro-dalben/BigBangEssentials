id: "warps_menu"
size: 54
title: "<gold>Warps do Servidor"

pagination:
  enabled: true
  source: "warps.global"
  content-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]

dynamic-item-template:
  item:
    material-id: "{warp_icon}"
    display-name: "<yellow>{warp_name}"
    lore:
      - "<gray>Mundo: <white>{warp_world}"
      - "<gray>Coordenadas: <white>{warp_x}, {warp_y}, {warp_z}"
      - ""
      - "<green>Clique para teleportar."
  actions:
    - type: "teleport_warp"
      params:
        warp-name: "{warp_name}"
    - type: "close_menu"

pages:
  main:
    default-page: true
    items:
      back_btn:
        slot: 45
        item:
          material-id: "minecraft:arrow"
          display-name: "<red>Voltar"
        actions:
          - type: "open_menu"
            params:
              menu-id: "teleports_main_menu"
      prev_btn:
        slot: 48
        item:
          material-id: "minecraft:paper"
          display-name: "<yellow>Página Anterior"
        actions:
          - type: "previous_page"
      next_btn:
        slot: 50
        item:
          material-id: "minecraft:paper"
          display-name: "<yellow>Próxima Página"
        actions:
          - type: "next_page"
