plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

base {
    archivesName = mod_id
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(":common").sourceSets.main)
        }
    }
}

// Include resources generated by data generators
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Implement the common module
    implementation project(":common")

    // Libraries that need to be packaged via jarJar for NeoForge
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    jarJar(group: 'org.java-websocket', name: 'Java-WebSocket', version: '[1.5.7,1.6.0)')
    additionalRuntimeClasspath 'org.java-websocket:Java-WebSocket:1.5.7'
    
    implementation 'org.yaml:snakeyaml:2.2'
    jarJar(group: 'org.yaml', name: 'snakeyaml', version: '[2.2,3.0)')
    additionalRuntimeClasspath 'org.yaml:snakeyaml:2.2'

    implementation 'com.zaxxer:HikariCP:5.1.0'
    jarJar(group: 'com.zaxxer', name: 'HikariCP', version: '[5.1.0,6.0.0)')
    additionalRuntimeClasspath 'com.zaxxer:HikariCP:5.1.0'

    implementation 'org.xerial:sqlite-jdbc:3.46.0.0'
    jarJar(group: 'org.xerial', name: 'sqlite-jdbc', version: '[3.46.0.0,3.47.0.0)')
    additionalRuntimeClasspath 'org.xerial:sqlite-jdbc:3.46.0.0'

    implementation 'com.mysql:mysql-connector-j:9.1.0'
    jarJar(group: 'com.mysql', name: 'mysql-connector-j', version: '[9.1.0,10.0.0)')
    additionalRuntimeClasspath 'com.mysql:mysql-connector-j:9.1.0'

    // APIs compileOnly
    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'curse.maven:ftb-library-404465:7029003'
    compileOnly 'curse.maven:architectury-api-419699:5786327'
    compileOnly 'curse.maven:ftb-ranks-314905:6522073'
    
    // Optional integration APIs
    compileOnly name: 'yawp-1.21.1-neoforge-0.6.2-beta1'
}

// Copy build_number.txt to resources
tasks.register("copyBuildNumber", Copy) {
    from rootProject.file('build_number.txt')
    into file('src/main/resources')
}

tasks.named('processResources').configure {
    dependsOn 'copyBuildNumber'
}

// NeoForge mod metadata replacement task
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Merge common classes and resources into the final NeoForge mod jar
tasks.named('jar', Jar) {
    from project(":common").sourceSets.main.output
}
